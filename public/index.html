return`<div class="g2" style="align-items:start"><div class="c"><h2>Videografie-Rechner</h2>
<div class="l" style="margin-bottom:6px">Arbeitszeit</div>${F('film','Dreh','Stunden vor Ort')}${F('edit','Schnitt / Edit','Stunden')}${F('rate','Stundensatz','€ pro Stunde')}
<div class="l" style="margin:18px 0 6px">Anfahrt</div>${F('trav','Fahrzeit','Stunden, einfache Strecke')}${F('tp','Fahrzeit bezahlt zu','% vom Stundensatz')}<div class="fr"><span>Strecke<small>Hin &amp; zurück oder nur hin</small></span><select data-k="calc.rt"><option value="1"${c.rt==1?' selected':''}>Hin &amp; zurück</option><option value="0"${c.rt!=1?' selected':''}>Nur hin</option></select></div>${F('km','Entfernung','km, einfache Strecke')}${F('cons','Verbrauch','l pro 100 km','0.1')}${F('gas','Spritpreis','€ pro Liter','0.01')}
<div class="l" style="margin:18px 0 6px">Extras</div>${F('gear','Equipment / Verschleiß','€ pro Gig')}${F('extra','Sonstiges','€ (Parken, Essen …)')}${F('buf','Puffer / Risiko','% Aufschlag')}<div class="fr"><span>Steuer</span><select data-k="calc.vat"><option value="0"${c.vat!='19'?' selected':''}>§19 UStG (keine MwSt)</option><option value="19"${c.vat=='19'?' selected':''}>MwSt 19%</option></select></div></div>
<div class="c" style="position:sticky;top:20px"><h2>Dein Preis</h2><div id="cres">${calcRes()}</div><p style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0"><button class="btn" data-cp>Als Projekt anlegen</button><button class="btn gh" data-cr>Zurücksetzen</button></p></div></div>`},
price(){const R=S.rc,P=S.prices.map((p,i)=>[p,i]),one=P.filter(([p])=>!p.r),mo=P.filter(([p])=>p.r),
f=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',
sub=one.reduce((x,[p])=>x+p.p*p.q,0),rush=sub*R.rush/100,dis=(sub+rush)*R.disc/100,net=sub+rush-dis,vat=R.vat=='19'?net*.19:0,tot=net+vat,mrr=mo.reduce((x,[p])=>x+p.p*p.q,0),
no='UGC-'+new Date().toISOString().slice(2,10).replace(/-/g,''),
row=([p,i])=>`<div class="row pq">${inp(`prices.${i}.n`,p.n)}${inp(`prices.${i}.p`,p.p,'number')}${inp(`prices.${i}.q`,p.q,'number')}<button class="x" data-del="prices.${i}">×</button></div>`,
sl=a=>a.filter(([p])=>p.q>0),
ln=([p])=>`<div class="rl"><span>${p.q}× ${esc(p.n)}</span><span>${f(p.p*p.q)}</span></div>`,
pd=(a,b)=>a+' '.repeat(Math.max(1,36-a.length-b.length))+b,
T=['@ITSMADEBYMO','ANGEBOT '+no,'Kunde: '+R.c,'-'.repeat(36),...sl(one).map(([p])=>pd(p.q+'x '+p.n,f(p.p*p.q))),'-'.repeat(36),pd('Zwischensumme',f(sub))];
if(R.rush)T.push(pd('Rush +'+R.rush+'%',f(rush)));if(R.disc)T.push(pd('Rabatt -'+R.disc+'%',f(-dis)));
T.push(R.vat=='19'?pd('MwSt 19%',f(vat)):'§19 UStG: keine MwSt',pd('GESAMT',f(tot)),pd('Anzahlung 50%',f(tot/2)));
if(mrr)T.push('',...sl(mo).map(([p])=>pd(p.q+'x '+p.n,f(p.p*p.q))),pd('Monatlich',f(mrr)),pd('Laufzeit '+R.term+' Mon.',f(mrr*R.term)));
T.push('','Lieferzeit: '+R.dl,'Nutzung: '+R.us,'Gültig bis: '+new Date(Date.now()+R.val*864e5).toLocaleDateString('de-DE'),R.pay?'Zahlung: '+R.pay:'','',R.n);window.RT=T.join('\n');
return`<div class="g2" style="align-items:start"><div><div class="c scr"><h2>Leistungen</h2><p style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px"><button class="btn gh" data-pre="s">Starter-Paket</button><button class="btn gh" data-pre="l">Launch-Paket</button><button class="btn gh" data-pre="0">Bon leeren</button></p><div class="row hd pq l"><span>Leistung</span><span>Preis €</span><span>Menge</span><span></span></div>${one.map(row).join('')}<p><button class="btn gh" data-add="prices" data-r="0">+ Leistung</button></p></div>
<div class="c scr" style="margin-top:14px"><h2>Retainer-Pakete</h2><div class="row hd pq l"><span>Paket</span><span>€ / Monat</span><span>Anzahl</span><span></span></div>${mo.map(row).join('')}<p><button class="btn gh" data-add="prices" data-r="1">+ Paket</button></p></div></div>
<div style="position:sticky;top:20px"><div class="rc"><div style="text-align:center"><div class="rb" style="font-size:17px;letter-spacing:.12em">@ITSMADEBYMO</div>VIDEOGRAF · UGC CREATOR<br>Content@itsmadebymo.com</div><div class="rd"></div>
<div class="rl"><span>ANGEBOT</span><span>${no}</span></div><div class="rl"><span>DATUM</span><span>${new Date().toLocaleDateString('de-DE')}</span></div>
<div class="rl"><span>KUNDE</span><input data-k="rc.c" value="${esc(R.c)}" placeholder="Marke / Name" style="width:62%;text-align:right"></div><div class="rd"></div>
${sl(one).map(ln).join('')||'<div style="text-align:center;opacity:.5">– Menge bei Leistungen eintragen –</div>'}<div class="rd"></div>
<div class="rl"><span>ZWISCHENSUMME</span><span>${f(sub)}</span></div>
<div class="rl"><span>RUSH +<input type="number" data-k="rc.rush" value="${R.rush}">%</span><span>${f(rush)}</span></div>
<div class="rl"><span>RABATT -<input type="number" data-k="rc.disc" value="${R.disc}">%</span><span>${f(-dis)}</span></div>
<div class="rl"><select data-k="rc.vat"><option value="19"${R.vat=='19'?' selected':''}>MwSt 19%</option><option value="0"${R.vat!='19'?' selected':''}>§19 UStG (keine MwSt)</option></select><span>${f(vat)}</span></div><div class="rd"></div>
<div class="rl rb"><span>GESAMT</span><span>${f(tot)}</span></div><div class="rl"><span>Anzahlung 50%</span><span>${f(tot/2)}</span></div>
${mrr?`<div class="rd"></div><div class="rb">MONATLICH · RETAINER</div>${sl(mo).map(ln).join('')}<div class="rl rb"><span>PRO MONAT</span><span>${f(mrr)}</span></div><div class="rl"><span>LAUFZEIT <input type="number" data-k="rc.term" value="${R.term}"> Mon.</span><span>${f(mrr*R.term)}</span></div>`:''}
<div class="rd"></div><div class="rl"><span>LIEFERZEIT</span><input data-k="rc.dl" value="${esc(R.dl)}" style="width:55%;text-align:right"></div><div class="rl"><span>NUTZUNG</span><input data-k="rc.us" value="${esc(R.us)}" style="width:55%;text-align:right"></div><div class="rl"><span>GÜLTIG <input type="number" data-k="rc.val" value="${R.val}"> TAGE</span><span>bis ${new Date(Date.now()+R.val*864e5).toLocaleDateString('de-DE')}</span></div><div class="rl"><span>ZAHLUNG</span><input data-k="rc.pay" value="${esc(R.pay)}" placeholder="IBAN / PayPal" style="width:62%;text-align:right"></div><div class="rd"></div><textarea data-k="rc.n">${esc(R.n)}</textarea><div class="bar"></div><div style="text-align:center">*** DANKE FÜRS VERTRAUEN ***</div></div>
<p style="text-align:center"><button class="btn" id="cr">Beleg kopieren</button></p></div></div>`},
cal(){const f=new Date(S.y,S.m,1),off=(f.getDay()+6)%7,n=new Date(S.y,S.m+1,0).getDate(),td=new Date().toISOString().slice(0,10);let h='';
for(let i=0;i<42;i++){const dn=i-off+1,dt=new Date(S.y,S.m,dn),ds=new Date(dt.getTime()-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10);
h+=`<div class="d${dn<1||dn>n?' o':''}${ds==td?' t':''}">${dt.getDate()}${S.cal.map((e,j)=>e.d==ds?`<span class="ev ${e.k}" title="${esc(e.t)}">${esc(e.t)}</span>`:'').join('')}</div>`}
return`<div class="c"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">${f.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><span><button class="btn gh" data-mo="-1">‹</button> <button class="btn gh" data-mo="1">›</button></span></div>
<div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="h">${x}</div>`).join('')}${h}</div></div>
<div class="c" style="margin-top:14px"><h2>Eintrag hinzufügen</h2><div class="g2" style="grid-template-columns:1fr 2fr 1fr auto"><input id="ed" type="date"><input id="et" placeholder="z.B. Edit Summer Reel"><select id="ek">${ET.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" data-ev>+</button></div>
${S.cal.map((e,i)=>[e,i]).sort((a,b)=>a[0].d.localeCompare(b[0].d)).map(([e,i])=>`<div class="row" style="grid-template-columns:90px 1fr 80px 28px"><span class="tag">${e.d}</span><span>${esc(e.t)}</span><span class="ev ${e.k}" style="margin:0;text-align:center">${e.k}</span><button class="x" data-del="cal.${i}">×</button></div>`).join('')}</div>`},
out(){const de=S.tl=='de',k=TK();return`<div class="c"><div class="hh"><h2>Outreach-Vorlage</h2><div class="seg"><button data-tl="en" class="${de?'':'on'}">English</button><button data-tl="de" class="${de?'on':''}">Deutsch</button></div></div><textarea data-k="${k}">${esc(S[k])}</textarea><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cp">Text kopieren</button><button class="btn gh" data-rs>Standardtext laden</button></p></div>
<div class="c scr" style="margin-top:14px"><h2>Angeschriebene Firmen (${S.leads.length})</h2><div class="mn"><div class="row hd ld l"><span>Firma</span><span>Social-Link</span><span>Datum</span><span>Ergebnis</span><span>Notiz</span><span></span></div>${S.leads.map((l,i)=>`<div class="row ld">${inp(`leads.${i}.n`,l.n,'text','Firma')}${inp(`leads.${i}.u`,l.u,'text','instagram.com/…')}${inp(`leads.${i}.d`,l.d,'date')}${sel(`leads.${i}.s`,l.s,LS)}${inp(`leads.${i}.o`,l.o,'text','Notiz')}<span>${l.s=='Offen'&&l.d&&(Date.now()-new Date(l.d))>6048e5?'<span title="Follow-up fällig" style="color:var(--a)">●</span> ':''}${l.u?`<a href="${esc(/^http/.test(l.u)?l.u:'https://'+l.u)}" target="_blank" rel="noopener" style="color:var(--a);text-decoration:none">↗</a>`:''}<button class="x" data-del="leads.${i}">×</button></span></div>`).join('')}</div><p><button class="btn" data-add="leads">+ Firma</button></p></div>`}};
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,n])=>`<button class="${S.view==k?'on':''}" data-v="${k}">${n}</button>`).join('');document.getElementById('v').innerHTML=V[S.view]();document.getElementById('dt').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
const set=(k,v)=>{const p=k.split('.');if(p.length==1){S[k]=v;return}if(p.length==2){S[p[0]][p[1]]=typeof S[p[0]][p[1]]=='number'?+v:v;return}const o=S[p[0]][p[1]],f=p[2];o[f]=typeof o[f]=='number'?+v:v};
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){set(k,e.target.value);save();if(k.startsWith('calc.')&&e.target.tagName=='INPUT'){const r=document.getElementById('cres');if(r)r.innerHTML=calcRes()}}});
document.addEventListener('change',e=>{if(e.target.dataset.k){save();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
if(D.v)S.view=D.v;else if(D.del){const[a,i]=D.del.split('.');S[a].splice(+i,1)}
else if(D.add){const a=D.add;S[a].push(a=='projects'?{b:'',t:'',d:'',p:0,dl:'',s:'Briefing'}:a=='leads'?{n:'',u:'',d:new Date().toISOString().slice(0,10),s:'Offen',o:''}:{n:'Neu',p:0,q:0,r:+D.r})}
else if(D.pre){const m=PRE[D.pre];S.prices.forEach(p=>p.q=m[p.n]||0)}
else if(D.mo){S.m+=+D.mo;if(S.m<0){S.m=11;S.y--}if(S.m>11){S.m=0;S.y++}}
else if(D.ev!==undefined){const d=ed.value,x=et.value.trim();if(!d||!x)return;S.cal.push({d,t:x,k:ek.value})}
else if(D.tl){S.tl=D.tl=='de'?'de':'en'}
else if(D.rs!==undefined){if(!confirm('Vorlage auf den Standardtext zurücksetzen?'))return;S[TK()]=TD[S.tl]}
else if(D.cp!==undefined){calcRes();S.projects.push({b:'',t:'Videografie-Gig',d:`${S.calc.film} h Dreh · ${S.calc.edit} h Edit · ${S.calc.km} km`,p:Math.round(window.CP),dl:'',s:'Briefing'});S.view='proj'}
else if(D.cr!==undefined){if(!confirm('Rechner auf Standardwerte zurücksetzen?'))return;S.calc=Object.assign({},CD)}
else if(t.id=='cr'){navigator.clipboard?.writeText(window.RT).then(()=>{t.textContent='Kopiert ✓';setTimeout(()=>t.textContent='Beleg kopieren',1500)}).catch(()=>{});return}
else if(t.id=='cp'){navigator.clipboard?.writeText(S[TK()]).then(()=>{t.textContent='Kopiert ✓';setTimeout(()=>t.textContent='Text kopieren',1500)}).catch(()=>{});return}
else return;save();render()});
render();
const pull=()=>fetch('/api/data').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(d&&d.prices){const v=S.view,l=S.tl;Object.assign(S,d);S.view=v;S.tl=l;fix();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();sync('☁ Synchron')}else save()}).catch(()=>sync('⚠ Offline – lokal gesichert'));
pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!tm)pull()});
</script></body></html>
